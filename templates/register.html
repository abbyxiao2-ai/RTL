{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <form action="/register" method="post">
        <div class="form-group">
            <input class="form-control" name="username" placeholder="Username" autocomplete="off" type="text"/>
        </div>
        <div class="form-group">
            <input class="form-control" name="password" placeholder="Password" autocomplete="off" type="password"/>
        </div>
        <div class="form-group">
            <input class="form-control" name="confirmation" placeholder="confirmation" autocomplete="off" type="password"/>
        </div>
        <button class="btn btn-primary" type="submit">
            Register
        </button>
    </form>
{% endblock %}
